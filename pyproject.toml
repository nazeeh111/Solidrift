[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solidrift"
version = "0.1.2"
description = "Shrink a real Boolean failure, lift a reversible repair, and export the evidence."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Nazeeh Abdul-Hadi"}]
readme = "README.md"
dependencies = []

[project.scripts]
solidrift = "solidrift.cli:main"

[tool.setuptools]
packages = ["solidrift"]
include-package-data = true

[tool.setuptools.package-data]
solidrift = ["fixtures/*", "web/*"]
